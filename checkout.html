<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout · Pizza Mania</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <div class="container nav-wrap">
    <a href="index.html" class="logo"><span>🍕</span> Pizza<span>Mania</span></a>
    <nav class="nav" id="nav">
      <a href="index.html"><i class="fas fa-home"></i> Início</a>
      <a href="cardapio.html"><i class="fas fa-pizza-slice"></i> Cardápio</a>
    </nav>
    <div class="nav-actions">
      <a href="carrinho.html" class="cart-btn"><i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
</header>

<section class="page-header">
  <div class="container"><h1>💳 Finalizar Pedido</h1><p>Preencha seus dados para entrega</p></div>
</section>

<section class="section">
  <div class="container checkout-layout">
    <form class="checkout-form" id="formCheckout">
      <h3><i class="fas fa-user"></i> Dados Pessoais</h3>
      <div class="form-row">
        <div class="form-group"><label>Nome completo *</label><input type="text" id="nome" required></div>
        <div class="form-group"><label>Telefone *</label><input type="tel" id="telefone" required></div>
      </div>

      <h3><i class="fas fa-map-marker-alt"></i> Endereço de Entrega</h3>
      <div class="form-row">
        <div class="form-group"><label>CEP *</label><input type="text" id="cep" required></div>
        <div class="form-group"><label>Rua *</label><input type="text" id="rua" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Número *</label><input type="text" id="numero" required></div>
        <div class="form-group"><label>Complemento</label><input type="text" id="complemento"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Bairro *</label><input type="text" id="bairro" required></div>
        <div class="form-group"><label>Cidade *</label><input type="text" id="cidade" required></div>
      </div>

      <h3><i class="fas fa-credit-card"></i> Forma de Pagamento</h3>
      <div class="pagamento-opcoes">
        <label><input type="radio" name="pag" value="Pix" checked><span>💠 Pix</span></label>
        <label><input type="radio" name="pag" value="Dinheiro"><span>💵 Dinheiro</span></label>
        <label><input type="radio" name="pag" value="Cartão de Crédito"><span>💳 Crédito</span></label>
        <label><input type="radio" name="pag" value="Cartão de Débito"><span>💳 Débito</span></label>
      </div>

      <div class="form-group" id="trocoBox" style="display:none">
        <label>Troco para quanto?</label>
        <input type="text" id="troco" placeholder="Ex: R$ 100,00">
      </div>
    </form>

    <aside class="checkout-resumo">
      <h3>Resumo do Pedido</h3>
      <div id="resumoItens"></div>
      <hr>
      <div class="resumo-item"><span>Subtotal</span><span id="coSub">R$ 0,00</span></div>
      <div class="resumo-item"><span>Entrega</span><span>R$ 8,00</span></div>
      <hr>
      <div class="resumo-total"><span>Total</span><strong id="coTotal">R$ 0,00</strong></div>
      <button class="btn btn-primary btn-block" id="btnConfirmar"><i class="fas fa-check-circle"></i> Confirmar Pedido 🍕</button>
    </aside>
  </div>
</section>

<footer class="footer"><div class="footer-bottom">© 2026 Pizza Mania</div></footer>

<script src="js/produtos.js"></script>
<script src="js/script.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
