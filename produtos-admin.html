<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos Admin · Pizza Mania</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="header admin-header">
  <div class="container nav-wrap">
    <a href="admin.html" class="logo"><span>🍕</span> Pizza<span>Mania</span> <small style="font-size:.6rem;background:#ff6b00;padding:2px 8px;border-radius:20px">ADMIN</small></a>
    <nav class="nav" id="nav">
      <a href="admin.html"><i class="fas fa-chart-line"></i> Dashboard</a>
      <a href="pedidos-admin.html"><i class="fas fa-receipt"></i> Pedidos</a>
      <a href="produtos-admin.html" class="active"><i class="fas fa-pizza-slice"></i> Produtos</a>
      <a href="index.html"><i class="fas fa-globe"></i> Ver Site</a>
    </nav>
    <div class="nav-actions"><button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button></div>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="admin-topbar">
      <h1 class="admin-title">🍕 Gerenciar Produtos</h1>
      <button class="btn btn-primary" id="btnNovoProduto"><i class="fas fa-plus"></i> Novo Produto</button>
    </div>

    <div class="tabela-wrap">
      <table class="tabela" id="tabelaProdutos">
        <thead><tr><th>Emoji</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

<!-- Modal -->
<div class="modal" id="modalProduto">
  <div class="modal-content">
    <h3 id="modalTitle">Novo Produto</h3>
    <div class="form-group"><label>Nome</label><input type="text" id="pNome"></div>
    <div class="form-group"><label>Descrição</label><input type="text" id="pDesc"></div>
    <div class="form-row">
      <div class="form-group"><label>Categoria</label>
        <select id="pCat">
          <option value="tradicionais">Tradicionais</option>
          <option value="especiais">Especiais</option>
          <option value="carnes">Carnes</option>
          <option value="queijos">Queijos</option>
          <option value="doces">Doces</option>
          <option value="bebidas">Bebidas</option>
        </select>
      </div>
      <div class="form-group"><label>Preço (base)</label><input type="number" step="0.01" id="pPreco"></div>
    </div>
    <div class="form-group"><label>Emoji</label><input type="text" id="pEmoji" maxlength="3" placeholder="🍕"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="btnCancelar">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvar">Salvar</button>
    </div>
  </div>
</div>

<footer class="footer"><div class="footer-bottom">© 2026 Pizza Mania Admin</div></footer>

<script src="js/produtos.js"></script>
<script src="js/script.js"></script>
<script src="js/admin.js"></script>
<script>initProdutosAdmin();</script>
</body>
</html>
